spring.application.name=organix
# Ganti port agar tidak error "port in use"
server.port=8081

# Koneksi ke Database Laragon
spring.datasource.url=jdbc:mysql://localhost:3308/organix_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Konfigurasi Hibernate agar tersambung
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout}">
<head>
    <title>Category Form - Organix</title>
</head>
<body>
    <div th:fragment="content">
        <div class="card">
            <div class="card-header" th:text="${isEdit} ? 'Edit Category' : 'Add New Category'">Category Form</div>
            <div class="card-body">
                <form th:action="@{/kategori/save}" th:object="${kategori}" method="post">
                    <input type="hidden" th:field="*{id}">
                    
                    <div class="mb-3">
                        <label class="form-label">Category Name</label>
                        <input type="text" class="form-control" th:field="*{name}" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea class="form-control" th:field="*{description}" rows="3"></textarea>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Points per Kg</label>
                        <input type="number" class="form-control" th:field="*{pointsPerKg}" value="100" required>
                    </div>
                    
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success">
                            <i class="fas fa-save"></i> Save
                        </button>
                        <a th:href="@{/kategori}" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>

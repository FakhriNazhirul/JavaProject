<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout}">
<head>
    <title>Complaints - Organix</title>
</head>
<body>
    <div th:fragment="content">
        <div class="card">
            <div class="card-body p-0">
                <table class="table table-hover mb-0">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>User ID</th>
                            <th>Subject</th>
                            <th>Description</th>
                            <th>Status</th>
                            <th>Date</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="c : ${complaints}">
                            <td th:text="${c.id}">1</td>
                            <td th:text="${c.userId}">1</td>
                            <td th:text="${c.subject}">Subject</td>
                            <td th:text="${#strings.abbreviate(c.description, 50)}">Description...</td>
                            <td>
                                <form th:action="@{/complaints/update/{id}(id=${c.id})}" method="post" class="d-inline">
                                    <select name="status" class="form-select form-select-sm" style="width: auto;" onchange="this.form.submit()">
                                        <option value="OPEN" th:selected="${c.status == 'OPEN'}">OPEN</option>
                                        <option value="PROCESSED" th:selected="${c.status == 'PROCESSED'}">PROCESSED</option>
                                        <option value="CLOSED" th:selected="${c.status == 'CLOSED'}">CLOSED</option>
                                    </select>
                                </form>
                            </td>
                            <td th:text="${#temporals.format(c.createdAt, 'dd MMM yyyy')}">13 May 2026</td>
                            <td>
                                <a th:href="@{/complaints/delete/{id}(id=${c.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Delete this complaint?')">
                                    <i class="fas fa-trash"></i>
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(complaints)}">
                            <td colspan="7" class="text-center py-4">
                                <i class="fas fa-exclamation-circle d-block mb-2" style="font-size: 2rem; opacity: 0.3;"></i>
                                No complaints
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout}">
<head>
    <title>User Form - Organix</title>
</head>
<body>
    <div th:fragment="content">
        <div class="card">
            <div class="card-header" th:text="${isEdit} ? 'Edit User' : 'Add New User'">User Form</div>
            <div class="card-body">
                <form th:action="@{/users/save}" th:object="${user}" method="post">
                    <input type="hidden" th:field="*{id}">
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Name</label>
                            <input type="text" class="form-control" th:field="*{name}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" th:field="*{email}" required>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" th:field="*{password}" th:required="${!isEdit}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Role</label>
                            <select class="form-select" th:field="*{role}">
                                <option value="USER">USER</option>
                                <option value="ADMIN">ADMIN</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            <i class="fas fa-map-marker-alt text-danger me-1"></i>
                            Domisili
                        </label>
                        <input type="text" class="form-control" th:field="*{domisili}"
                               placeholder="Contoh: Jl. Merdeka No.10, Jakarta Selatan">
                        <div class="form-text text-muted">
                            Alamat atau kota tempat tinggal user
                        </div>
                    </div>
                    
                    <div class="mb-3" th:if="${isEdit}">
                        <label class="form-label">Points</label>
                        <input type="number" class="form-control" th:field="*{points}">
                    </div>
                    
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success">
                            <i class="fas fa-save"></i> Save
                        </button>
                        <a th:href="@{/users}" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>

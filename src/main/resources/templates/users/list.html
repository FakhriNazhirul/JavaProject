<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout}">
<head>
    <title>Users - Organix</title>
</head>
<body>
    <div th:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div></div>
            <a th:href="@{/users/new}" class="btn btn-success">
                <i class="fas fa-plus"></i> Add New User
            </a>
        </div>

        <div class="card">
            <div class="card-body p-0">
                <table class="table table-hover mb-0">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Domisili</th>
                            <th>Points</th>
                            <th>Role</th>
                            <th>Created</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="user : ${users}">
                            <td th:text="${user.id}">1</td>
                            <td th:text="${user.name}">John Doe</td>
                            <td th:text="${user.email}">john@example.com</td>
                            <td>
                                <span th:if="${user.domisili != null and !#strings.isEmpty(user.domisili)}">
                                    <i class="fas fa-map-marker-alt text-danger me-1"></i>
                                    <span th:text="${user.domisili}">Jakarta</span>
                                </span>
                                <span th:if="${user.domisili == null or #strings.isEmpty(user.domisili)}"
                                      class="text-muted fst-italic">-</span>
                            </td>
                            <td>
                                <span class="badge bg-warning text-dark" th:text="${user.points}">0</span>
                            </td>
                            <td th:text="${user.role}">USER</td>
                            <td th:text="${#temporals.format(user.createdAt, 'dd MMM yyyy')}">13 May 2026</td>
                            <td>
                                <div class="action-btns">
                                    <a th:href="@{/users/edit/{id}(id=${user.id})}" class="btn btn-sm btn-primary">
                                        <i class="fas fa-edit"></i>
                                    </a>
                                    <a th:href="@{/users/delete/{id}(id=${user.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Are you sure?')">
                                        <i class="fas fa-trash"></i>
                                    </a>
                                    <a th:href="@{/points/user/{id}(id=${user.id})}" class="btn btn-sm btn-info text-white">
                                        <i class="fas fa-coins"></i>
                                    </a>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(users)}">
                            <td colspan="8" class="text-center py-4">
                                <i class="fas fa-users d-block mb-2" style="font-size: 2rem; opacity: 0.3;"></i>
                                No users yet
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>

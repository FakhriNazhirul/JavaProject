<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar - Organix</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #f8fafc; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
        .register-card { background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); padding: 40px; width: 100%; max-width: 440px; }
        .btn-primary { background: #00897B; border-color: #00897B; }
        .btn-primary:hover { background: #00695C; border-color: #00695C; }
    </style>
</head>
<body>
    <div class="register-card">
        <h2 class="text-center mb-2" style="color: #00897B; font-weight: bold;">Organix</h2>
        <p class="text-center text-muted mb-4">Daftar sebagai user</p>

        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <form th:action="@{/register}" method="post" th:object="${user}">
            <div class="mb-3">
                <label class="form-label">Nama</label>
                <input type="text" th:field="*{name}" class="form-control" required placeholder="Nama lengkap">
            </div>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" th:field="*{email}" class="form-control" required placeholder="nama@email.com">
            </div>
            <div class="mb-4">
                <label class="form-label">Password</label>
                <input type="password" th:field="*{password}" class="form-control" required minlength="6" placeholder="Minimal 6 karakter">
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2">Daftar</button>
        </form>

        <p class="text-center text-muted mt-3 mb-0">
            Sudah punya akun?
            <a th:href="@{/login}" style="color:#00897B;text-decoration:none;font-weight:600;">Login</a>
        </p>
    </div>
</body>
</html>
